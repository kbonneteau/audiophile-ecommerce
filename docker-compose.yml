version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: audiophile_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - audiophile_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: audiophile_server
    environment:
      - NODE_ENV=development
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - audiophile_network
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: audiophile_client
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - audiophile_network
    command: npm start

volumes:
  postgres_data:

networks:
  audiophile_network:
    driver: bridge
